# Example configuration for TranslatorWorker
# This follows the same pattern used for ActorRolloutRef and Critic workers

# Worker configuration
translator:
  # Model configuration - can be local path or Hugging Face model
  model:
    path: "Helsinki-NLP/opus-mt-en-fr"  # Hugging Face model
    # Alternative: path: "/local/path/to/translation/model"  # Local model path
  
  # Training strategy
  strategy: "fsdp"  # Options: fsdp, megatron, vllm
  
  # Translation-specific configuration
  translation_config:
    max_length: 512
    num_beams: 4
    do_sample: false
    temperature: 1.0
    early_stopping: true
    length_penalty: 1.0
  
  # Model loading options
  trust_remote_code: false
  use_fused_kernels: false
  use_remove_padding: false
  external_lib: null
  
  # Profiler configuration (optional)
  profiler:
    tool: "torch"  # Options: torch, nsys, npu
    tool_config:
      torch:
        profile_memory: true
        record_shapes: true
  
  # FSDP configuration (if using FSDP strategy)
  fsdp_config:
    fsdp_size: 4  # Number of GPUs for FSDP
    param_offload: false
    optimizer_offload: false
  
  # Megatron configuration (if using Megatron strategy)
  megatron:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    seed: 42

# Example configurations for different use cases

# 1. English to French translation
translator_en_fr:
  model:
    path: "Helsinki-NLP/opus-mt-en-fr"
  strategy: "fsdp"
  translation_config:
    max_length: 256
    num_beams: 5

# 2. English to German translation
translator_en_de:
  model:
    path: "Helsinki-NLP/opus-mt-en-de"
  strategy: "fsdp"
  translation_config:
    max_length: 512
    num_beams: 4

# 3. Local custom model
translator_local:
  model:
    path: "/path/to/local/translation/model"
  strategy: "fsdp"
  trust_remote_code: true
  translation_config:
    max_length: 128
    num_beams: 3

# 4. Large model with Megatron strategy
translator_large:
  model:
    path: "facebook/nllb-200-distilled-600M"
  strategy: "megatron"
  megatron:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 2
    context_parallel_size: 1
  translation_config:
    max_length: 1024
    num_beams: 6
    do_sample: true
    temperature: 0.8
