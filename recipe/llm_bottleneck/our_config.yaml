reward_model:
  # Set the reward manager to "custom" to use our CustomRewardManager
  reward_manager: "custom"
  # Can include other reward manager parameters here

translator:
  # Model configuration - can be local path or Hugging Face model
  model:
    path: "Qwen/Qwen3-0.6B"  # Hugging Face model
    # Alternative: path: "/local/path/to/translation/model"  # Local model path
  
  # Training strategy
  strategy: "fsdp"  # Options: fsdp, megatron, vllm
  
  # Translation-specific configuration
  translation_config:
    max_length: 512
    num_beams: 4
    do_sample: false
    temperature: 1.0
    early_stopping: true
    length_penalty: 1.0
  
  # Model loading options
  trust_remote_code: false
  use_fused_kernels: false
  use_remove_padding: false
  external_lib: null
  
  # Profiler configuration (optional)
  profiler:
    tool: "torch"  # Options: torch, nsys, npu
    tool_config:
      torch:
        profile_memory: true
        record_shapes: true
  
  # FSDP configuration (if using FSDP strategy)
  fsdp_config:
    fsdp_size: 4  # Number of GPUs for FSDP
    param_offload: false
    optimizer_offload: false
  
  # Megatron configuration (if using Megatron strategy)
  megatron:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    seed: 42